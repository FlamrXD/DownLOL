<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Downlol | Free YT Downloader</title>
    <link rel="stylesheet" href="css/style.css">
    <meta property="og:site_name" content="Downlol">
    <meta property="og:title" content="DownLOL - Free and Open Source YT Downloader">
    <meta property="og:description" content="Download YouTube videos and audio for free. No ads, no tracking.">
    <meta name="theme-color" content="#120b0b">
</head>

<body>
    <main>
        <div class="row">
            <input type="text" id="url" placeholder="Enter YouTube URL or Video ID">
            <button id="downloadBtn">Download</button>
        </div>

        <div class="settings">
            <button id="settingsToggle" type="button" aria-expanded="false">Settings ▴</button>
            <div id="settingsPanel">
                <label>
                    Type
                    <select id="type">
                        <option value="video">Video</option>
                        <option value="audio">Audio</option>
                    </select>
                </label>
                <label>
                    Format
                    <select id="format"></select>
                </label>
                <label>
                    Quality
                    <select id="quality"></select>
                </label>
            </div>
        </div>

        <p id="status"></p>
        <div id="progress" hidden>
            <div id="bar"></div>
        </div>
        <p id="status"></p>
    </main>
    <footer>

                height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">

    <script src="js/settings.js"></script>

</body>

</html>
