name: Build Nightly (SEA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            platform_name: windows-x64
            archive_format: zip
          - os: ubuntu-latest
            platform_name: linux-x64
            archive_format: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install

      - name: Bundle with esbuild
        run: npx esbuild server.js --bundle --platform=node --format=cjs --outfile=dist/bundle.cjs

      - name: Build Single Executable Application
        run: node --build-sea sea-config.json

      - name: Prepare dist directory (Windows)
        if: runner.os == 'Windows'
        run: |
          move downlol.exe dist/
          xcopy public dist\public /E /I /Y

      - name: Prepare dist directory (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          # SEA builds might output 'downlol.exe' or 'downlol' depending on host/config mapping
          if [ -f "downlol.exe" ]; then
            mv downlol.exe dist/downlol
          elif [ -f "downlol" ]; then
            mv downlol dist/
          else
            # Fallback search if name varied
            mv *.exe dist/downlol || mv downlol* dist/downlol
          fi
          chmod +x dist/downlol
          cp -r public dist/

      - name: Archive artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.platform_name }}.zip

      - name: Archive artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          zip -r ${{ matrix.platform_name }}.zip dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_name }}
          path: |
            *.zip